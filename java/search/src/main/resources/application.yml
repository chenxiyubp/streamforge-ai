server:
  tomcat:
    connection-timeout: 300000
  port: 8201
elasticsearch-client:
    hosts: http://localhost:9200
module-name: search
spring:
  redis:
    host: localhost
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    name: datasource
    url: jdbc:mysql://localhost:3306/bilibili?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  zipkin:
    base-url: http://localhost:9411
    sender:
      type: web
    sleuth:
      sampler:
        probability: 1
  application:
    name: search
xxl:
  job:
    admin:
      addresses: http://localhost:8080/xxl-job-admin
    accessToken: ${XXL_JOB_ACCESS_TOKEN}
    executor:
      port: 9916
      appname: demo-service-impl
      logpath: ${XXL_JOB_LOG_PATH:./logs/xxl-job}
global-exception-handler:
  enabled: true
